name = "ai-designer-studio"
compatibility_date = "2026-11-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "crates/web/dist"
not_found_handling = "single-page-application"

[[routes]]
pattern = "ai-designer.spodeian.trade"
custom_domain = true

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true

[vars]
ENVIRONMENT = "production"
