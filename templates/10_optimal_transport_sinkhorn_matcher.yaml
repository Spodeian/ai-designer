aid_version: "1.0.0"

metadata:
  model_id: "optimal_transport_sinkhorn_matcher"
  display_name: "Optimal Transport Sinkhorn Point Matcher"
  domain: "03_building_blocks_and_losses"
  author: "AI Designer Studio"
  license: "Apache-2.0"
  target_hardware:
    profile_name: "ConsumerGPU_RTX4090"
    max_vram_bytes: 25769803776
    peak_fp16_tflops: 330.0
    peak_fp8_tflops: 660.0
    memory_bandwidth_gbs: 1008.0
  tags: ["optimal_transport", "sinkhorn", "point_clouds", "geometric_matching", "fenchel_young"]

inputs:
  - id: "source_pointset"
    name: "Source 3D Point Coordinates"
    space:
      kind: "continuous_vector"
      dimension: 3
    symbolic_shape: ["B", "N", 3]
    normalizer:
      kind: "standardize"
      mean_fill: 0.0
    coordinate_encoding:
      kind: "none"

outputs:
  - id: "transport_cost_matrix"
    name: "Doubly Stochastic Transport Plan"
    space:
      kind: "continuous_vector"
      dimension: 128
    symbolic_shape: ["B", "N", 128]
    constraint:
      kind: "sparsemax"
    loss: "ot_cfm"

graph:
  topology:
    kind: "residual_stream"
    norm_placement: "pre_ln"
    layer_scale_init: 0.01
  nodes:
    - id: "point_embed"
      name: "Point Spatial Embedding"
      operator:
        type: "linear"
        in_features: 3
        out_features: 128
        bias: true
      precision: "bf16"
      metadata: {}

    - id: "geom_norm_1"
      name: "Geometric LayerNorm"
      operator:
        type: "rms_norm"
        dim: 128
        eps: 0.00001
      precision: "bf16"
      metadata: {}

    - id: "cross_point_attn"
      name: "Point Set Self-Attention"
      operator:
        type: "mha"
        num_heads: 4
        d_k: 32
        d_v: 32
        dropout: 0.0
      precision: "bf16"
      metadata: {}

    - id: "sinkhorn_proj"
      name: "Sinkhorn Cost Projection"
      operator:
        type: "linear"
        in_features: 128
        out_features: 128
        bias: false
      precision: "bf16"
      metadata: {}

  connections:
    - from_node: "point_embed"
      from_port: 0
      to_node: "geom_norm_1"
      to_port: 0
    - from_node: "geom_norm_1"
      from_port: 0
      to_node: "cross_point_attn"
      to_port: 0
    - from_node: "cross_point_attn"
      from_port: 0
      to_node: "sinkhorn_proj"
      to_port: 0

training:
  auto_partition_parameters: true
  muon:
    lr: 0.02
    momentum: 0.95
    newton_schulz_steps: 5
    weight_decay: 0.01
  adamw:
    lr: 0.001
    betas: [0.9, 0.95]
    eps: 0.00000001
    weight_decay: 0.01
  scheduler:
    kind: "warmup_stable_decay"
    warmup_ratio: 0.05
    stable_ratio: 0.75
    decay_ratio: 0.20
    min_lr_ratio: 0.01
  hygiene:
    auto_clip: true
    clip_percentile: 90.0
    max_norm: 1.0
    ema_decay: 0.999
    grokfast: true
    activation_checkpointing: false
  loss_balancing: "fixed_weights"

precision:
  default_weight_precision: "bf16"
  default_activation_precision: "bf16"
  reduction_precision: "fp32"
  master_weight_precision: "fp32"
