aid_version: "1.0.0"

metadata:
  model_id: "safe_cbf_qp_diffusion_policy"
  display_name: "Safe Differentiable CBF-QP Control Policy"
  domain: "08_learning_paradigms_rl_and_alignment"
  author: "AI Designer Studio"
  license: "Apache-2.0"
  target_hardware:
    profile_name: "EdgeRobotics_JetsonOrin"
    max_vram_bytes: 8589934592
    peak_fp16_tflops: 275.0
    peak_fp8_tflops: 550.0
    memory_bandwidth_gbs: 204.8
  tags: ["cbf_qp", "safe_rl", "control_barriers", "robotics", "differentiable_optimization"]

inputs:
  - id: "robot_state"
    name: "Proprioceptive State (q, q_dot, obstacles)"
    space:
      kind: "continuous_vector"
      dimension: 32
    symbolic_shape: ["B", 1, 32]
    normalizer:
      kind: "standardize"
      mean_fill: 0.0
    coordinate_encoding:
      kind: "none"

outputs:
  - id: "safe_torques"
    name: "Forward-Invariant Safe Actuation Torques"
    space:
      kind: "continuous_vector"
      dimension: 7
    symbolic_shape: ["B", 1, 7]
    constraint:
      kind: "cbf_qp"
      safe_distance: 0.05
      max_velocity: 1.5
    loss: "mse"

graph:
  topology:
    kind: "serial_stack"
  nodes:
    - id: "state_encoder"
      name: "State Feature Encoder"
      operator:
        type: "linear"
        in_features: 32
        out_features: 256
        bias: true
      precision: "bf16"
      metadata: {}

    - id: "enc_norm"
      name: "Encoder Norm"
      operator:
        type: "rms_norm"
        dim: 256
        eps: 0.00001
      precision: "bf16"
      metadata: {}

    - id: "policy_mlp"
      name: "Policy Hidden SwiGLU"
      operator:
        type: "swiglu"
        in_features: 256
        hidden_features: 512
      precision: "bf16"
      metadata: {}

    - id: "nominal_action_head"
      name: "Nominal Action Generator u_nom"
      operator:
        type: "linear"
        in_features: 256
        out_features: 7
        bias: true
      precision: "bf16"
      metadata: {}

  connections:
    - from_node: "state_encoder"
      from_port: 0
      to_node: "enc_norm"
      to_port: 0
    - from_node: "enc_norm"
      from_port: 0
      to_node: "policy_mlp"
      to_port: 0
    - from_node: "policy_mlp"
      from_port: 0
      to_node: "nominal_action_head"
      to_port: 0

training:
  auto_partition_parameters: true
  muon:
    lr: 0.02
    momentum: 0.95
    newton_schulz_steps: 5
    weight_decay: 0.01
  adamw:
    lr: 0.001
    betas: [0.9, 0.95]
    eps: 0.00000001
    weight_decay: 0.01
  scheduler:
    kind: "warmup_stable_decay"
    warmup_ratio: 0.05
    stable_ratio: 0.75
    decay_ratio: 0.20
    min_lr_ratio: 0.01
  hygiene:
    auto_clip: true
    clip_percentile: 90.0
    max_norm: 1.0
    ema_decay: 0.999
    grokfast: true
    activation_checkpointing: false
  loss_balancing: "fixed_weights"

precision:
  default_weight_precision: "bf16"
  default_activation_precision: "bf16"
  reduction_precision: "fp32"
  master_weight_precision: "fp32"
