aid_version: "1.0.0"
metadata:
  model_id: "patch_xlstm_probabilistic_forecaster"
  display_name: "Patch xLSTM Extreme-Value Probabilistic Forecaster"
  domain: "TimeSeriesAndFinance"
  author: "Custom AI Designer Studio"
  license: "Apache-2.0"
  target_hardware:
    profile_name: "ConsumerGPU_RTX4090"
    max_vram_bytes: 25769803776
    peak_fp16_tflops: 330.0
    peak_fp8_tflops: 660.0
    memory_bandwidth_gbs: 1008.0
  tags: ["time-series", "finance", "xlstm", "mlstm", "revin", "crps-tail-risk"]

inputs:
  - id: "multivariate_prices"
    name: "Non-Stationary Multivariate Asset Channels"
    space:
      kind: "time_series"
      channels: 32
      horizon: 256
      stationary: false
    symbolic_shape: ["B", 32, 256]
    normalizer:
      kind: "rev_in"
      eps: 0.00001
      affine: true

outputs:
  - id: "calibrated_quantiles"
    name: "Multi-Horizon Calibrated Quantiles (p10, p50, p90, GPD Tail)"
    space:
      kind: "time_series"
      channels: 32
      horizon: 64
      stationary: false
    symbolic_shape: ["B", 32, 64]
    constraint:
      kind: "quantile_crps_gpd"
      quantiles: [0.1, 0.5, 0.9]
    loss: "quantile_crps"

graph:
  topology:
    kind: "residual_stream"
    norm_placement: "pre_ln"
    layer_scale_init: 0.01
  nodes:
    - id: "patch_embedding"
      name: "Patch Linear Projection"
      operator:
        type: "linear"
        in_features: 16
        out_features: 128
        bias: true
      precision: "bf16"
    - id: "xlstm_core"
      name: "Extended LSTM (mLSTM Matrix Memory)"
      operator:
        type: "x_lstm"
        d_model: 128
        num_heads: 4
        variant: "mLSTM"
      precision: "bf16"
    - id: "kan_spline_ffn"
      name: "Kolmogorov-Arnold Network (KAN Spline)"
      operator:
        type: "kan_layer"
        in_features: 128
        out_features: 128
        grid_size: 5
        spline_order: 3
      precision: "fp32"
    - id: "quantile_head"
      name: "Quantile Projection Head"
      operator:
        type: "linear"
        in_features: 128
        out_features: 3 # 3 quantiles per channel
        bias: true
      precision: "fp32"

training:
  auto_partition_parameters: true
  muon:
    lr: 0.02
    momentum: 0.95
    newton_schulz_steps: 5
    weight_decay: 0.01
  adamw:
    lr: 0.001
    betas: [0.9, 0.98]
    eps: 0.00000001
    weight_decay: 0.01
  scheduler:
    kind: "warmup_stable_decay"
    warmup_ratio: 0.05
    stable_ratio: 0.70
    decay_ratio: 0.25
    min_lr_ratio: 0.01
  hygiene:
    auto_clip: true
    clip_percentile: 90.0
    max_norm: 1.0
    ema_decay: 0.999
    grokfast: true
    activation_checkpointing: false
  loss_balancing: "fixed_weights"

precision:
  default_weight_precision: "bf16"
  default_activation_precision: "bf16"
  reduction_precision: "fp32"
  master_weight_precision: "fp32"
