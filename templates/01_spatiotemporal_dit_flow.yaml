aid_version: "1.0.0"
metadata:
  model_id: "spatiotemporal_dit_flow"
  display_name: "Spatio-Temporal DiT Flow Matching Generator"
  domain: "VisionAndVideo"
  author: "Custom AI Designer Studio"
  license: "Apache-2.0"
  target_hardware:
    profile_name: "ConsumerGPU_RTX4090"
    max_vram_bytes: 25769803776
    peak_fp16_tflops: 330.0
    peak_fp8_tflops: 660.0
    memory_bandwidth_gbs: 1008.0
  tags: ["diffusion", "dit", "flow-matching", "video", "rotary-embeddings"]

inputs:
  - id: "video_latents"
    name: "Noisy Video Latent Grid"
    space:
      kind: "video_3d"
      frames: 16
      resolution: [64, 64]
      channels: 4
    symbolic_shape: ["B", 4, 16, 64, 64]
    normalizer:
      kind: "none"
    coordinate_encoding:
      kind: "ro_pe3_d"
      base: 10000.0
    patching:
      patch_size: [2, 2]
      flatten_channels: true
  - id: "timestep"
    name: "Continuous Flow Timestep"
    space:
      kind: "continuous_vector"
      dimension: 1
      range: [0.0, 1.0]
    symbolic_shape: ["B", 1]
    coordinate_encoding:
      kind: "random_fourier_features"
      num_features: 256
      scale: 1.0

outputs:
  - id: "velocity_field"
    name: "Predicted Flow Velocity Field (v_t = x_1 - x_0)"
    space:
      kind: "video_3d"
      frames: 16
      resolution: [64, 64]
      channels: 4
    symbolic_shape: ["B", 4, 16, 64, 64]
    constraint:
      kind: "direct_linear"
    loss: "optimal_transport_conditional_flow_matching"

graph:
  topology:
    kind: "residual_stream"
    norm_placement: "pre_ln"
    layer_scale_init: 0.01
  nodes:
    - id: "patch_proj"
      name: "Patch Projection"
      operator:
        type: "linear"
        in_features: 16
        out_features: 384
        bias: true
      precision: "bf16"
    - id: "wtconv_down"
      name: "Wavelet Cascaded Convolution"
      operator:
        type: "wt_conv"
        in_channels: 384
        out_channels: 384
        wavelet_levels: 3
      precision: "bf16"
    - id: "attn_block_1"
      name: "Multi-Head Attention Layer"
      operator:
        type: "mha"
        num_heads: 6
        d_k: 64
        d_v: 64
        dropout: 0.0
      precision: "bf16"
    - id: "slot_attn"
      name: "Object-Centric Slot Attention"
      operator:
        type: "slot_attention"
        num_slots: 8
        slot_dim: 384
        iters: 3
      precision: "bf16"
    - id: "unpatch_proj"
      name: "Unpatch Head"
      operator:
        type: "linear"
        in_features: 384
        out_features: 16
        bias: true
      precision: "fp32"

training:
  auto_partition_parameters: true
  muon:
    lr: 0.02
    momentum: 0.95
    newton_schulz_steps: 5
    weight_decay: 0.01
  adamw:
    lr: 0.001
    betas: [0.9, 0.95]
    eps: 0.00000001
    weight_decay: 0.01
  scheduler:
    kind: "warmup_stable_decay"
    warmup_ratio: 0.05
    stable_ratio: 0.75
    decay_ratio: 0.20
    min_lr_ratio: 0.01
  hygiene:
    auto_clip: true
    clip_percentile: 90.0
    max_norm: 1.0
    ema_decay: 0.999
    grokfast: false
    activation_checkpointing: false
  loss_balancing: "fixed_weights"

precision:
  default_weight_precision: "bf16"
  default_activation_precision: "bf16"
  reduction_precision: "fp32"
  master_weight_precision: "fp32"
