aid_version: "1.0.0"

metadata:
  model_id: "speculative_medusa_draft_decoder"
  display_name: "Speculative Medusa Multi-Head Tree Decoder"
  domain: "15_compression_peft_and_speculative_inference"
  author: "AI Designer Studio"
  license: "Apache-2.0"
  target_hardware:
    profile_name: "ConsumerGPU_RTX4090"
    max_vram_bytes: 25769803776
    peak_fp16_tflops: 330.0
    peak_fp8_tflops: 660.0
    memory_bandwidth_gbs: 1008.0
  tags: ["speculative_decoding", "medusa", "peft", "tree_attention", "low_latency"]

inputs:
  - id: "base_residual_state"
    name: "Base Model Top Residual Hidden State"
    space:
      kind: "continuous_vector"
      dimension: 768
    symbolic_shape: ["B", 1, 768]
    normalizer:
      kind: "standardize"
      mean_fill: 0.0
    coordinate_encoding:
      kind: "none"

outputs:
  - id: "draft_logits_k1"
    name: "Speculative Token +1 Distribution"
    space:
      kind: "continuous_vector"
      dimension: 32000
    symbolic_shape: ["B", 1, 32000]
    constraint:
      kind: "direct_linear"
    loss: "cross_entropy"

graph:
  topology:
    kind: "residual_stream"
    norm_placement: "pre_ln"
    layer_scale_init: 0.01
  nodes:
    - id: "draft_norm"
      name: "Draft Backbone LayerNorm"
      operator:
        type: "rms_norm"
        dim: 768
        eps: 0.00001
      precision: "bf16"
      metadata: {}

    - id: "medusa_head_res_1"
      name: "Medusa Residual Non-Linear MLP"
      operator:
        type: "swiglu"
        in_features: 768
        hidden_features: 1536
      precision: "bf16"
      metadata: {}

    - id: "medusa_head_proj_1"
      name: "Medusa Head +1 Logits"
      operator:
        type: "linear"
        in_features: 768
        out_features: 32000
        bias: false
      precision: "bf16"
      metadata: {}

  connections:
    - from_node: "draft_norm"
      from_port: 0
      to_node: "medusa_head_res_1"
      to_port: 0
    - from_node: "medusa_head_res_1"
      from_port: 0
      to_node: "medusa_head_proj_1"
      to_port: 0

training:
  auto_partition_parameters: true
  muon:
    lr: 0.02
    momentum: 0.95
    newton_schulz_steps: 5
    weight_decay: 0.01
  adamw:
    lr: 0.001
    betas: [0.9, 0.95]
    eps: 0.00000001
    weight_decay: 0.01
  scheduler:
    kind: "warmup_stable_decay"
    warmup_ratio: 0.05
    stable_ratio: 0.75
    decay_ratio: 0.20
    min_lr_ratio: 0.01
  hygiene:
    auto_clip: true
    clip_percentile: 90.0
    max_norm: 1.0
    ema_decay: 0.999
    grokfast: true
    activation_checkpointing: false
  loss_balancing: "fixed_weights"

precision:
  default_weight_precision: "bf16"
  default_activation_precision: "bf16"
  reduction_precision: "fp32"
  master_weight_precision: "fp32"
