aid_version: "1.0.0"
metadata:
  model_id: "energy_based_langevin_predictive_coding"
  display_name: "49. Continuous Energy-Based Model (EBM) with Langevin MCMC & Local Predictive Coding (PCN)"
  domain: "EnergyBasedModelsAndPredictiveCoding"
  author: "AI Designer Studio"
  license: "Apache-2.0"
  target_hardware:
    profile_name: "ConsumerGPU_RTX4090"
    max_vram_bytes: 25769803776
    peak_fp16_tflops: 165.2
    peak_fp8_tflops: 330.3
    memory_bandwidth_gbs: 1008.0
  tags:
    - "energy_based_model"
    - "predictive_coding"
    - "langevin_mcmc"
    - "modern_hopfield"
    - "non_backprop"
inputs:
  - id: "sensory_clamp_input"
    name: "Clamped Sensory Observation Vector"
    space:
      kind: "continuous_vector"
      dimension: 512
      range:
        - -1.0
        - 1.0
    symbolic_shape:
      - "B"
      - 512
    normalizer:
      kind: "standardize"
      mean_fill: 0.0
    coordinate_encoding:
      kind: "none"
    patching: null
outputs:
  - id: "equilibrium_latent_score"
    name: "Relaxed Equilibrium State & Stein Score"
    space:
      kind: "continuous_vector"
      dimension: 512
      range: null
    symbolic_shape:
      - "B"
      - 512
    constraint:
      kind: "input_convex_icnn"
    loss: "score_matching_sde"
graph:
  topology:
    kind: "recurrent_depth_loop"
    max_steps: 8
    input_anchored: true
    halting:
      kind: "ponder_net_kl"
      lambda_prior: 0.05
  nodes:
    - id: "pcn_langevin_layer_1"
      name: "Cortical Predictive Coding & Langevin MCMC Relaxation Layer 1"
      operator:
        type: "energy_langevin_mcmc"
        dim: 512
        langevin_steps: 8
        step_size: 0.05
      precision: "bf16"
      metadata: {}
    - id: "hopfield_energy_basin"
      name: "Modern Hopfield Exponential Associative Energy Well"
      operator:
        type: "modern_hopfield"
        num_heads: 8
        beta: 4.0
      precision: "bf16"
      metadata: {}
    - id: "pcn_langevin_layer_2"
      name: "Cortical Predictive Coding & Langevin MCMC Relaxation Layer 2"
      operator:
        type: "energy_langevin_mcmc"
        dim: 512
        langevin_steps: 8
        step_size: 0.025
      precision: "bf16"
      metadata: {}
    - id: "equilibrium_norm"
      name: "Equilibrium Free-Energy RMSNorm"
      operator:
        type: "rms_norm"
        dim: 512
        eps: 0.00001
      precision: "fp32"
      metadata: {}
    - id: "scalar_energy_head"
      name: "Contrastive Free-Energy & Score Readout"
      operator:
        type: "linear"
        in_features: 512
        out_features: 512
        bias: false
      precision: "fp32"
      metadata: {}
  connections: []
training:
  auto_partition_parameters: true
  muon:
    lr: 0.015
    momentum: 0.95
    newton_schulz_steps: 5
    weight_decay: 0.01
  adamw:
    lr: 0.0003
    betas:
      - 0.9
      - 0.99
    eps: 0.00000001
    weight_decay: 0.01
  scheduler:
    kind: "warmup_stable_decay"
    warmup_ratio: 0.05
    stable_ratio: 0.75
    decay_ratio: 0.2
    min_lr_ratio: 0.01
  hygiene:
    auto_clip: true
    clip_percentile: 90.0
    max_norm: 1.0
    ema_decay: 0.999
    grokfast: true
    activation_checkpointing: false
  loss_balancing: "fixed_weights"
