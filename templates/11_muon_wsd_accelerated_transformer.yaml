aid_version: "1.0.0"

metadata:
  model_id: "muon_wsd_accelerated_transformer"
  display_name: "Muon Newton-Schulz WSD Accelerated Transformer"
  domain: "04_training_methods_and_optimisers"
  author: "AI Designer Studio"
  license: "Apache-2.0"
  target_hardware:
    profile_name: "ConsumerGPU_RTX4090"
    max_vram_bytes: 25769803776
    peak_fp16_tflops: 330.0
    peak_fp8_tflops: 660.0
    memory_bandwidth_gbs: 1008.0
  tags: ["muon", "newton_schulz", "warmup_stable_decay", "autoclip", "2d_gemm"]

inputs:
  - id: "token_ids"
    name: "Input Token Sequence"
    space:
      kind: "continuous_vector"
      dimension: 768
    symbolic_shape: ["B", "T", 768]
    normalizer:
      kind: "standardize"
      mean_fill: 0.0
    coordinate_encoding:
      kind: "rope_1d"
      base: 10000.0

outputs:
  - id: "logits"
    name: "Token Next-Step Logits"
    space:
      kind: "continuous_vector"
      dimension: 32000
    symbolic_shape: ["B", "T", 32000]
    constraint:
      kind: "direct_linear"
    loss: "cross_entropy"

graph:
  topology:
    kind: "residual_stream"
    norm_placement: "pre_ln"
    layer_scale_init: 0.01
  nodes:
    - id: "pre_norm"
      name: "Input Pre-Norm"
      operator:
        type: "rms_norm"
        dim: 768
        eps: 0.00001
      precision: "bf16"
      metadata: {}

    - id: "self_attn"
      name: "Muon-Partitioned Attention GEMM"
      operator:
        type: "mha"
        num_heads: 12
        d_k: 64
        d_v: 64
        dropout: 0.0
      precision: "bf16"
      metadata:
        opt_group: "muon_gemm"

    - id: "mid_norm"
      name: "Mid-Block Norm"
      operator:
        type: "rms_norm"
        dim: 768
        eps: 0.00001
      precision: "bf16"
      metadata: {}

    - id: "swiglu_mlp"
      name: "SwiGLU Intermediate MLP"
      operator:
        type: "swiglu"
        in_features: 768
        hidden_features: 2048
      precision: "bf16"
      metadata:
        opt_group: "muon_gemm"

    - id: "lm_head"
      name: "Readout Head (AdamW)"
      operator:
        type: "linear"
        in_features: 768
        out_features: 32000
        bias: false
      precision: "bf16"
      metadata:
        opt_group: "adamw_head"

  connections:
    - from_node: "pre_norm"
      from_port: 0
      to_node: "self_attn"
      to_port: 0
    - from_node: "self_attn"
      from_port: 0
      to_node: "mid_norm"
      to_port: 0
    - from_node: "mid_norm"
      from_port: 0
      to_node: "swiglu_mlp"
      to_port: 0
    - from_node: "swiglu_mlp"
      from_port: 0
      to_node: "lm_head"
      to_port: 0

training:
  auto_partition_parameters: true
  muon:
    lr: 0.02
    momentum: 0.95
    newton_schulz_steps: 5
    weight_decay: 0.01
  adamw:
    lr: 0.001
    betas: [0.9, 0.95]
    eps: 0.00000001
    weight_decay: 0.01
  scheduler:
    kind: "warmup_stable_decay"
    warmup_ratio: 0.05
    stable_ratio: 0.75
    decay_ratio: 0.20
    min_lr_ratio: 0.01
  hygiene:
    auto_clip: true
    clip_percentile: 90.0
    max_norm: 1.0
    ema_decay: 0.999
    grokfast: true
    activation_checkpointing: true
  loss_balancing: "fixed_weights"

precision:
  default_weight_precision: "bf16"
  default_activation_precision: "bf16"
  reduction_precision: "fp32"
  master_weight_precision: "fp32"
