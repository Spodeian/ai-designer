aid_version: "1.0.0"
metadata:
  model_id: "equivariant_biomolecular_flow"
  display_name: "SE(3)-Equivariant Biomolecular Flow Model"
  domain: "GraphsAndBiomolecules"
  author: "Custom AI Designer Studio"
  license: "Apache-2.0"
  target_hardware:
    profile_name: "ConsumerGPU_RTX4090"
    max_vram_bytes: 25769803776
    peak_fp16_tflops: 330.0
    peak_fp8_tflops: 660.0
    memory_bandwidth_gbs: 1008.0
  tags: ["biomolecules", "alphafold", "se3-equivariant", "ipa", "egnn", "fape"]

inputs:
  - id: "residue_frames"
    name: "Amino Acid Residue Rigid Frames T_i = (R_i, t_i)"
    space:
      kind: "graph_relational"
      node_features: 128
      edge_features: 64
      heterophilic: false
    symbolic_shape: ["B", 256, 128]
    normalizer:
      kind: "none"
    coordinate_encoding:
      kind: "rwpe_graph"
      walk_steps: 16

outputs:
  - id: "predicted_conformation"
    name: "Refined 3D Backbone Coordinates"
    space:
      kind: "continuous_vector"
      dimension: 3
    symbolic_shape: ["B", 256, 3]
    constraint:
      kind: "continuous_rotation6_d"
    loss: "frame_aligned_point_error_fape"

graph:
  topology:
    kind: "residual_stream"
    norm_placement: "pre_ln"
    layer_scale_init: 0.1
  nodes:
    - id: "egnn_spatial_layer"
      name: "E(3)-Equivariant Graph Layer"
      operator:
        type: "egnn"
        node_dim: 128
        edge_dim: 64
      precision: "bf16"
    - id: "evoformer_triangle"
      name: "Evoformer Triangle Multiplicative Update"
      operator:
        type: "evoformer_triangle"
        d_pair: 64
      precision: "bf16"
    - id: "ipa_layer"
      name: "Invariant Point Attention (IPA)"
      operator:
        type: "invariant_point_attention"
        num_heads: 8
        num_points: 4
      precision: "bf16"
    - id: "coord_update_head"
      name: "Frame Transition Update Head"
      operator:
        type: "linear"
        in_features: 128
        out_features: 3
        bias: false
      precision: "fp32"

training:
  auto_partition_parameters: true
  muon:
    lr: 0.01
    momentum: 0.95
    newton_schulz_steps: 5
    weight_decay: 0.001
  adamw:
    lr: 0.0005
    betas: [0.9, 0.95]
    eps: 0.00000001
    weight_decay: 0.001
  scheduler:
    kind: "warmup_stable_decay"
    warmup_ratio: 0.05
    stable_ratio: 0.85
    decay_ratio: 0.10
    min_lr_ratio: 0.01
  hygiene:
    auto_clip: true
    clip_percentile: 90.0
    max_norm: 1.0
    ema_decay: 0.999
    grokfast: false
    activation_checkpointing: false
  loss_balancing: "fixed_weights"

precision:
  default_weight_precision: "bf16"
  default_activation_precision: "bf16"
  reduction_precision: "fp32"
  master_weight_precision: "fp32"
