aid_version: "1.0.0"
metadata:
  model_id: "symplectic_fourier_neural_operator"
  display_name: "Symplectic Fourier Neural Operator for Conservative PDEs"
  domain: "SciMLAndPhysics"
  author: "Custom AI Designer Studio"
  license: "Apache-2.0"
  target_hardware:
    profile_name: "DataCenter_H100_SXM5"
    max_vram_bytes: 85899345920
    peak_fp16_tflops: 989.0
    peak_fp8_tflops: 1978.0
    memory_bandwidth_gbs: 3350.0
  tags: ["sciml", "pde", "fno", "symplectic", "energy-conservation"]

inputs:
  - id: "pde_initial_field"
    name: "Initial Condition Vector Field u(x, y, 0)"
    space:
      kind: "coordinate_field"
      domain_dim: 2
      time_dependent: false
    symbolic_shape: ["B", 64, 64, 2]
    normalizer:
      kind: "none"
    coordinate_encoding:
      kind: "random_fourier_features"
      num_features: 64
      scale: 1.0

outputs:
  - id: "divergence_free_velocity"
    name: "Conserved Velocity Field u(x, y, t)"
    space:
      kind: "coordinate_field"
      domain_dim: 2
      time_dependent: true
    symbolic_shape: ["B", 64, 64, 2]
    constraint:
      kind: "curl_free_vector_field"
    loss: "sobolev_h1_physics_residual"

graph:
  topology:
    kind: "reversible_split_stream"
  nodes:
    - id: "fno_spectral_branch"
      name: "Fourier Neural Operator Branch"
      operator:
        type: "fourier_neural_operator"
        modes: [16, 16]
        width: 64
      precision: "fp32"
    - id: "deep_equilibrium_layer"
      name: "Anderson Accelerated Fixed-Point DEQ"
      operator:
        type: "deq"
        d_model: 64
        max_iters: 15
        tolerance: 0.0001
      precision: "fp32"
    - id: "unrolled_admm"
      name: "Unrolled ADMM Inverse Solver"
      operator:
        type: "admm_net"
        num_stages: 6
        rho: 1.0
      precision: "fp32"
    - id: "curl_projection_head"
      name: "Analytic Curl Projection Head"
      operator:
        type: "linear"
        in_features: 64
        out_features: 2
        bias: false
      precision: "fp32"

training:
  auto_partition_parameters: true
  muon:
    lr: 0.005
    momentum: 0.95
    newton_schulz_steps: 5
    weight_decay: 0.0001
  adamw:
    lr: 0.0002
    betas: [0.9, 0.99]
    eps: 0.00000001
    weight_decay: 0.0001
  scheduler:
    kind: "cosine_with_warmup"
    warmup_ratio: 0.10
    min_lr_ratio: 0.001
  hygiene:
    auto_clip: true
    clip_percentile: 95.0
    max_norm: 0.5
    ema_decay: 0.9995
    grokfast: false
    activation_checkpointing: false
  loss_balancing: "ntk_balancing"

precision:
  default_weight_precision: "fp32"
  default_activation_precision: "fp32"
  reduction_precision: "fp32"
  master_weight_precision: "fp32"
