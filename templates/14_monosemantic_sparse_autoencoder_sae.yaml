aid_version: "1.0.0"

metadata:
  model_id: "monosemantic_sparse_autoencoder_sae"
  display_name: "Monosemantic Sparse Autoencoder (SAE)"
  domain: "10_xai_and_ai_analysis_methods"
  author: "AI Designer Studio"
  license: "Apache-2.0"
  target_hardware:
    profile_name: "ConsumerGPU_RTX4090"
    max_vram_bytes: 25769803776
    peak_fp16_tflops: 330.0
    peak_fp8_tflops: 660.0
    memory_bandwidth_gbs: 1008.0
  tags: ["mechanistic_interpretability", "sparse_autoencoder", "sae", "monosemantic", "l0_sparsity"]

inputs:
  - id: "residual_stream_activation"
    name: "Model Hidden Residual Vector x"
    space:
      kind: "continuous_vector"
      dimension: 768
    symbolic_shape: ["B", "T", 768]
    normalizer:
      kind: "standardize"
      mean_fill: 0.0
    coordinate_encoding:
      kind: "none"

outputs:
  - id: "reconstructed_activation"
    name: "Reconstructed Residual Stream x_hat"
    space:
      kind: "continuous_vector"
      dimension: 768
    symbolic_shape: ["B", "T", 768]
    constraint:
      kind: "direct_linear"
    loss: "mse"

graph:
  topology:
    kind: "serial_stack"
  nodes:
    - id: "center_norm"
      name: "Input Centering Norm"
      operator:
        type: "rms_norm"
        dim: 768
        eps: 0.00001
      precision: "bf16"
      metadata: {}

    - id: "sae_encoder"
      name: "Overcomplete Feature Dictionary (W_enc)"
      operator:
        type: "linear"
        in_features: 768
        out_features: 12288
        bias: true
      precision: "bf16"
      metadata:
        expansion_factor: "16x"

    - id: "sae_decoder"
      name: "Constrained Feature Decoder (W_dec)"
      operator:
        type: "linear"
        in_features: 12288
        out_features: 768
        bias: true
      precision: "bf16"
      metadata: {}

  connections:
    - from_node: "center_norm"
      from_port: 0
      to_node: "sae_encoder"
      to_port: 0
    - from_node: "sae_encoder"
      from_port: 0
      to_node: "sae_decoder"
      to_port: 0

training:
  auto_partition_parameters: true
  muon:
    lr: 0.02
    momentum: 0.95
    newton_schulz_steps: 5
    weight_decay: 0.01
  adamw:
    lr: 0.001
    betas: [0.9, 0.95]
    eps: 0.00000001
    weight_decay: 0.01
  scheduler:
    kind: "warmup_stable_decay"
    warmup_ratio: 0.05
    stable_ratio: 0.75
    decay_ratio: 0.20
    min_lr_ratio: 0.01
  hygiene:
    auto_clip: true
    clip_percentile: 90.0
    max_norm: 1.0
    ema_decay: 0.999
    grokfast: true
    activation_checkpointing: false
  loss_balancing: "fixed_weights"

precision:
  default_weight_precision: "bf16"
  default_activation_precision: "bf16"
  reduction_precision: "fp32"
  master_weight_precision: "fp32"
