aid_version: "1.0.0"

metadata:
  model_id: "bitnet_ternary_1_58_quant"
  display_name: "BitNet b1.58 1-Bit Ternary Linear Network"
  domain: "13_precision_and_numerics"
  author: "AI Designer Studio"
  license: "Apache-2.0"
  target_hardware:
    profile_name: "ConsumerGPU_RTX4090"
    max_vram_bytes: 25769803776
    peak_fp16_tflops: 330.0
    peak_fp8_tflops: 660.0
    memory_bandwidth_gbs: 1008.0
  tags: ["bitnet", "ternary", "1_58_bit", "extreme_quantization", "sub_8bit"]

inputs:
  - id: "quant_input"
    name: "Quantized Embedding Inputs"
    space:
      kind: "continuous_vector"
      dimension: 512
    symbolic_shape: ["B", "T", 512]
    normalizer:
      kind: "standardize"
      mean_fill: 0.0
    coordinate_encoding:
      kind: "none"

outputs:
  - id: "ternary_output"
    name: "BitLinear Projected Representations"
    space:
      kind: "continuous_vector"
      dimension: 512
    symbolic_shape: ["B", "T", 512]
    constraint:
      kind: "direct_linear"
    loss: "mse"

graph:
  topology:
    kind: "residual_stream"
    norm_placement: "pre_ln"
    layer_scale_init: 0.01
  nodes:
    - id: "bit_norm_1"
      name: "Sub-Layer RMSNorm"
      operator:
        type: "rms_norm"
        dim: 512
        eps: 0.00001
      precision: "fp16"
      metadata: {}

    - id: "bitlinear_1"
      name: "BitLinear Ternary Weight Matrix 1"
      operator:
        type: "linear"
        in_features: 512
        out_features: 1024
        bias: false
      precision: "int8_sym"
      metadata:
        quant_mode: "bitnet_1_58"

    - id: "bit_norm_2"
      name: "Mid RMSNorm"
      operator:
        type: "rms_norm"
        dim: 1024
        eps: 0.00001
      precision: "fp16"
      metadata: {}

    - id: "bitlinear_2"
      name: "BitLinear Ternary Weight Matrix 2"
      operator:
        type: "linear"
        in_features: 1024
        out_features: 512
        bias: false
      precision: "int8_sym"
      metadata:
        quant_mode: "bitnet_1_58"

  connections:
    - from_node: "bit_norm_1"
      from_port: 0
      to_node: "bitlinear_1"
      to_port: 0
    - from_node: "bitlinear_1"
      from_port: 0
      to_node: "bit_norm_2"
      to_port: 0
    - from_node: "bit_norm_2"
      from_port: 0
      to_node: "bitlinear_2"
      to_port: 0

training:
  auto_partition_parameters: true
  muon:
    lr: 0.02
    momentum: 0.95
    newton_schulz_steps: 5
    weight_decay: 0.01
  adamw:
    lr: 0.001
    betas: [0.9, 0.95]
    eps: 0.00000001
    weight_decay: 0.01
  scheduler:
    kind: "warmup_stable_decay"
    warmup_ratio: 0.05
    stable_ratio: 0.75
    decay_ratio: 0.20
    min_lr_ratio: 0.01
  hygiene:
    auto_clip: true
    clip_percentile: 90.0
    max_norm: 1.0
    ema_decay: 0.999
    grokfast: true
    activation_checkpointing: false
  loss_balancing: "fixed_weights"

precision:
  default_weight_precision: "int8_sym"
  default_activation_precision: "fp16"
  reduction_precision: "fp32"
  master_weight_precision: "fp32"
