aid_version: "1.0.0"

metadata:
  model_id: "differentially_private_dp_sgd"
  display_name: "Differentially Private Certified Classifier"
  domain: "11_ai_safety_privacy_and_verification"
  author: "AI Designer Studio"
  license: "Apache-2.0"
  target_hardware:
    profile_name: "ConsumerGPU_RTX4090"
    max_vram_bytes: 25769803776
    peak_fp16_tflops: 330.0
    peak_fp8_tflops: 660.0
    memory_bandwidth_gbs: 1008.0
  tags: ["differential_privacy", "dp_sgd", "renyi_accountant", "lipschitz_bounded", "safety"]

inputs:
  - id: "private_features"
    name: "Private Clinical / Tabular Features"
    space:
      kind: "continuous_vector"
      dimension: 128
    symbolic_shape: ["B", 1, 128]
    normalizer:
      kind: "standardize"
      mean_fill: 0.0
    coordinate_encoding:
      kind: "none"

outputs:
  - id: "evidential_class_probabilities"
    name: "Certified Dirichlet Probabilities"
    space:
      kind: "continuous_vector"
      dimension: 10
    symbolic_shape: ["B", 1, 10]
    constraint:
      kind: "evidential_dirichlet"
      num_classes: 10
    loss: "cross_entropy"

graph:
  topology:
    kind: "serial_stack"
  nodes:
    - id: "bounded_linear_1"
      name: "Spectral-Bounded Projection 1"
      operator:
        type: "linear"
        in_features: 128
        out_features: 256
        bias: false
      precision: "bf16"
      metadata:
        spectral_norm: "true"

    - id: "privacy_norm"
      name: "Layer Normalization"
      operator:
        type: "rms_norm"
        dim: 256
        eps: 0.00001
      precision: "bf16"
      metadata: {}

    - id: "swiglu_core"
      name: "Lipschitz-Continuous SwiGLU"
      operator:
        type: "swiglu"
        in_features: 256
        hidden_features: 512
      precision: "bf16"
      metadata: {}

    - id: "dirichlet_head"
      name: "Concentration Parameter Readout"
      operator:
        type: "linear"
        in_features: 256
        out_features: 10
        bias: true
      precision: "bf16"
      metadata: {}

  connections:
    - from_node: "bounded_linear_1"
      from_port: 0
      to_node: "privacy_norm"
      to_port: 0
    - from_node: "privacy_norm"
      from_port: 0
      to_node: "swiglu_core"
      to_port: 0
    - from_node: "swiglu_core"
      from_port: 0
      to_node: "dirichlet_head"
      to_port: 0

training:
  auto_partition_parameters: true
  muon:
    lr: 0.02
    momentum: 0.95
    newton_schulz_steps: 5
    weight_decay: 0.01
  adamw:
    lr: 0.001
    betas: [0.9, 0.95]
    eps: 0.00000001
    weight_decay: 0.01
  scheduler:
    kind: "warmup_stable_decay"
    warmup_ratio: 0.05
    stable_ratio: 0.75
    decay_ratio: 0.20
    min_lr_ratio: 0.01
  hygiene:
    auto_clip: true
    clip_percentile: 90.0
    max_norm: 1.0
    ema_decay: 0.999
    grokfast: true
    activation_checkpointing: false
  loss_balancing: "fixed_weights"

precision:
  default_weight_precision: "bf16"
  default_activation_precision: "bf16"
  reduction_precision: "fp32"
  master_weight_precision: "fp32"
