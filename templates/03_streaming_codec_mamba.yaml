aid_version: "1.0.0"
metadata:
  model_id: "streaming_codec_mamba"
  display_name: "Streaming Real-Time Neural Audio Codec"
  domain: "AudioAndSpeech"
  author: "Custom AI Designer Studio"
  license: "Apache-2.0"
  target_hardware:
    profile_name: "EdgeMCU_CortexM55"
    max_vram_bytes: 67108864
    peak_fp16_tflops: 0.2
    peak_fp8_tflops: 0.4
    memory_bandwidth_gbs: 4.0
  tags: ["audio", "mamba", "dsp", "low-latency", "streaming"]

inputs:
  - id: "audio_pcm"
    name: "Raw 16kHz Audio Waveform"
    space:
      kind: "time_series"
      channels: 1
      horizon: 320 # 20ms frame at 16kHz
      stationary: true
    symbolic_shape: ["B", 1, 320]
    normalizer:
      kind: "none"

outputs:
  - id: "reconstructed_audio"
    name: "Reconstructed PCM Frame"
    space:
      kind: "time_series"
      channels: 1
      horizon: 320
      stationary: true
    symbolic_shape: ["B", 1, 320]
    constraint:
      kind: "direct_linear"
    loss: "smooth_l1"

graph:
  topology:
    kind: "serial_stack"
  nodes:
    - id: "snake_conv_enc"
      name: "Snake Periodic Conv Encoder"
      operator:
        type: "snake"
        frequency: 1.0
      precision: "bf16"
    - id: "causal_mamba_ssd"
      name: "Causal Mamba-2 SSD Core"
      operator:
        type: "mamba2_ssd"
        d_model: 128
        d_state: 32
        d_conv: 4
        expand: 2
      precision: "bf16"
    - id: "unrolled_lista"
      name: "LISTA Sparse Coding Dictionary"
      operator:
        type: "lista"
        num_unrolled_steps: 8
        lambda: 0.1
      precision: "bf16"
    - id: "pcm_out_proj"
      name: "Linear Audio Synthesis Head"
      operator:
        type: "linear"
        in_features: 128
        out_features: 320
        bias: true
      precision: "fp32"

training:
  auto_partition_parameters: true
  muon:
    lr: 0.01
    momentum: 0.95
    newton_schulz_steps: 5
    weight_decay: 0.001
  adamw:
    lr: 0.0005
    betas: [0.9, 0.95]
    eps: 0.00000001
    weight_decay: 0.001
  scheduler:
    kind: "cosine_with_warmup"
    warmup_ratio: 0.05
    min_lr_ratio: 0.01
  hygiene:
    auto_clip: true
    clip_percentile: 90.0
    max_norm: 1.0
    ema_decay: 0.999
    grokfast: false
    activation_checkpointing: false
  loss_balancing: "fixed_weights"

precision:
  default_weight_precision: "bf16"
  default_activation_precision: "bf16"
  reduction_precision: "fp32"
  master_weight_precision: "fp32"
