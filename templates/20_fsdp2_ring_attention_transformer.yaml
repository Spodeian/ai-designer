aid_version: "1.0.0"

metadata:
  model_id: "fsdp2_ring_attention_transformer"
  display_name: "FSDP-2 Per-Parameter Ring Attention Backbone"
  domain: "16_distributed_and_scalable"
  author: "AI Designer Studio"
  license: "Apache-2.0"
  target_hardware:
    profile_name: "DataCenter_H100_SXM5"
    max_vram_bytes: 85899345920
    peak_fp16_tflops: 989.0
    peak_fp8_tflops: 1978.0
    memory_bandwidth_gbs: 3350.0
  tags: ["fsdp2", "ring_attention", "distributed", "long_context", "megatron"]

inputs:
  - id: "sharded_tokens"
    name: "Sub-Ring Distributed Tokens"
    space:
      kind: "continuous_vector"
      dimension: 4096
    symbolic_shape: ["B", "T", 4096]
    normalizer:
      kind: "standardize"
      mean_fill: 0.0
    coordinate_encoding:
      kind: "rope_1d"
      base: 500000.0

outputs:
  - id: "sharded_logits"
    name: "Next Token Logits"
    space:
      kind: "continuous_vector"
      dimension: 32000
    symbolic_shape: ["B", "T", 32000]
    constraint:
      kind: "direct_linear"
    loss: "cross_entropy"

graph:
  topology:
    kind: "residual_stream"
    norm_placement: "pre_ln"
    layer_scale_init: 0.01
  nodes:
    - id: "fsdp_norm_1"
      name: "Per-Parameter Sharded Norm"
      operator:
        type: "rms_norm"
        dim: 4096
        eps: 0.00001
      precision: "bf16"
      metadata:
        fsdp2_shard: "true"

    - id: "ring_attn"
      name: "Ring Attention Circular Communication"
      operator:
        type: "mha"
        num_heads: 32
        d_k: 128
        d_v: 128
        dropout: 0.0
      precision: "bf16"
      metadata:
        distributed_impl: "ring_attention"
        fsdp2_shard: "true"

    - id: "fsdp_norm_2"
      name: "Inter-Block Sharded Norm"
      operator:
        type: "rms_norm"
        dim: 4096
        eps: 0.00001
      precision: "bf16"
      metadata:
        fsdp2_shard: "true"

    - id: "fsdp_swiglu"
      name: "Sharded SwiGLU FFN"
      operator:
        type: "swiglu"
        in_features: 4096
        hidden_features: 14336
      precision: "bf16"
      metadata:
        fsdp2_shard: "true"

    - id: "vocab_head"
      name: "Parallel Vocabulary Projection"
      operator:
        type: "linear"
        in_features: 4096
        out_features: 32000
        bias: false
      precision: "bf16"
      metadata:
        tensor_parallel: "true"

  connections:
    - from_node: "fsdp_norm_1"
      from_port: 0
      to_node: "ring_attn"
      to_port: 0
    - from_node: "ring_attn"
      from_port: 0
      to_node: "fsdp_norm_2"
      to_port: 0
    - from_node: "fsdp_norm_2"
      from_port: 0
      to_node: "fsdp_swiglu"
      to_port: 0
    - from_node: "fsdp_swiglu"
      from_port: 0
      to_node: "vocab_head"
      to_port: 0

training:
  auto_partition_parameters: true
  muon:
    lr: 0.02
    momentum: 0.95
    newton_schulz_steps: 5
    weight_decay: 0.01
  adamw:
    lr: 0.001
    betas: [0.9, 0.95]
    eps: 0.00000001
    weight_decay: 0.01
  scheduler:
    kind: "warmup_stable_decay"
    warmup_ratio: 0.05
    stable_ratio: 0.75
    decay_ratio: 0.20
    min_lr_ratio: 0.01
  hygiene:
    auto_clip: true
    clip_percentile: 90.0
    max_norm: 1.0
    ema_decay: 0.999
    grokfast: true
    activation_checkpointing: true
  loss_balancing: "fixed_weights"

precision:
  default_weight_precision: "bf16"
  default_activation_precision: "bf16"
  reduction_precision: "fp32"
  master_weight_precision: "fp32"
